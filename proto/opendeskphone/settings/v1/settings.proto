syntax = "proto3";

package opendeskphone.settings.v1;

// Convention for every .proto file here: a list is a `repeated` field of a
// message type (never of a scalar, and never a delimited string), so that
// an item can gain fields later.

// Settings that only Open Desk Phone has.  Stored on the phone in protobuf
// text format as /nvdata/opendeskphone/settings.txtpb, a file the stock
// firmware never reads.  Settings stock also knows stay in the stock XML
// layers.
//
// Every field has explicit presence: an absent field means "not set
// locally", which is not the same as false.  (A repeated field with no
// entries is absent.)
//
// A provisioning server can supply the same settings in the configuration it
// sends, as <setting id="opendeskphone_<field name>" value="..."/> (0 or 1 for
// an on/off setting).  For each field the effective value is: the provisioned
// value if the server marked it conflict="freeze"; otherwise the value in this
// file if the field is present; otherwise the provisioned value; otherwise the
// default.
message OpenDeskPhoneSettings {
  // Run the SSH server.  Default: false.
  optional bool ssh_enabled = 1;
  // Ignore the firmware a provisioning server asks for.  Default: false,
  // which follows the server as the stock firmware does.  Meant for
  // development against a server that provisions stock firmware.
  optional bool ignore_provisioned_firmware = 2;
  // Give UART A to the serial console.  Default: false.  The console and an
  // electronic hook switch (EHS) headset adapter use the same UART and
  // cannot share it.  While this is false the adapter has it (the stock
  // "ehs" setting picks the adapter type), the kernel and the firmware
  // write nothing to it, and there is no serial console; set it to true to
  // have the console and give up EHS.
  optional bool serial_console = 3;
  // Serve the Prometheus scrape endpoint, GET /metrics, which needs no
  // login.  Default: true.  Independent of the stock web_ui_enabled
  // setting, which turns web configuration on and off.
  optional bool metrics_enabled = 4;
  // The idle screen's softkeys, in order.  Default (also when there are
  // none here): Call Log, Contacts, Status, Menu, Apps, DND, Forward, and,
  // on the color models (D60, D62, D65, D80), Theme.  The softkeys of the
  // "idle" keymap state in the XML configuration are not used.  In this file, one entry per softkey:
  //   idle_softkeys { function: FUNCTION_CALL_LOG }
  //   idle_softkeys { app { name: "parking" } }
  // The provisioned form is the XML configuration's own, a comma-separated
  // value of call_log, contacts, status, menu, apps, dnd, forward, redial,
  // theme, and app:<name>:
  // <setting id="opendeskphone_idle_softkeys" value="call_log,contacts,menu"/>.
  repeated IdleSoftkey idle_softkeys = 5;
  // The built-in apps that are switched off.  Such an app is not in the
  // phone's app list and cannot be opened.  Default: none.  Present with
  // no apps in it, it switches every app on, whatever the provisioning
  // server said.  In this file:
  //   disabled_apps {
  //     apps { name: "calendar" }
  //     apps { name: "parking" }
  //   }
  // The provisioned form is the XML configuration's own, a comma-separated
  // value of app names:
  // <setting id="opendeskphone_disabled_apps" value="calendar,parking"/>.
  optional DisabledApps disabled_apps = 6;
  // The theme of the color models (D60, D62, D65, D80), by the name of a
  // built-in one (e.g., "dusk"; the phone's theme selector and the web UI
  // list them).  A theme is a wallpaper and the palette every screen is
  // drawn in.  Default: "tides".  An unknown name is the default theme.
  // The provisioned form carries the same name:
  // <setting id="opendeskphone_theme" value="dusk"/>.  A provisioning server
  // can instead supply a picture (stock's wallpaper_file setting), and a
  // palette for it (opendeskphone_palette_file; see
  // proto/opendeskphone/palette/v1/palette.proto).  Of what the server
  // supplies, the picture goes before the name; a name chosen on the phone
  // goes before both unless the server marked its own conflict="freeze".
  //
  // A theme chosen on the phone is also kept on the PBX, for the phone's
  // user, when the PBX has Open DPMA's store of app data: a phone that
  // was reset, and another phone of the same user, take it from there.
  optional string theme = 7;
  // What the phone and the PBX last agreed the theme is.  The phone
  // writes it; it is not a setting, and is not to be edited.
  optional ThemeSync theme_sync = 8;
}

// The theme as the phone and the PBX last agreed on it.  The PBX keeps
// the theme a user chose in its store of app data (Open DPMA), in the
// user's keys of the name "opendeskphone", which no app can have, under the key
// "theme"; the value is the theme's name.
//
// While `theme` (above) is what `theme` here says, the phone has nothing
// to send, and takes a newer entry of the PBX as the user's choice (made
// on another phone, or before this phone was reset).  When `theme` is
// something else, it was chosen on this phone since, and the phone sends
// it.  When both changed, the later choice stays: the entry's time on
// the PBX against `changed_unix`; the phone's, if the phone did not know
// the time when the choice was made.
message ThemeSync {
  // The PBX's id of the user this is about.  With another user on the
  // phone, a theme that user has on the PBX is taken, and the theme of
  // the phone is not sent as theirs.
  string user = 1;
  // The theme both had; absent: none was chosen.
  optional string theme = 2;
  // The version of the PBX's entry; 0: the PBX had none.
  uint64 version = 3;
  // When `theme` (above) was first seen to differ from the theme here, in
  // seconds since the Unix epoch; 0: it does not differ, or the phone's
  // clock was not set.
  uint64 changed_unix = 4;
}

// An app, by its name (e.g., "calendar").
message App {
  string name = 1;
}

// A softkey of the idle screen.  The web interface's messages use this
// definition too.
message IdleSoftkey {
  // The built-in functions a softkey can have.
  enum Function {
    FUNCTION_UNSPECIFIED = 0;
    // The call log; labeled "Missed Calls" while there are unseen ones.
    FUNCTION_CALL_LOG = 1;
    FUNCTION_CONTACTS = 2;
    // Phone information.
    FUNCTION_STATUS = 3;
    FUNCTION_MENU = 4;
    // The app launcher.
    FUNCTION_APPS = 5;
    // Switches Do Not Disturb.
    FUNCTION_DND = 6;
    // The call forwarding menu.
    FUNCTION_FORWARD = 7;
    FUNCTION_REDIAL = 8;
    // The theme selector.  Only the color models (D60, D62, D65, D80)
    // have themes; on the others the softkey is not shown.
    FUNCTION_THEME = 9;
  }
  // What the softkey does.  An entry with neither is skipped.
  oneof action {
    Function function = 1;
    // Opens this app; not shown while the phone has no such app.
    App app = 2;
  }
}

// The built-in apps that are switched off.
message DisabledApps {
  repeated App apps = 1;
}
