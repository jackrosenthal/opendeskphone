syntax = "proto3";

package opendeskphone.palette.v1;

// The colors of every screen of a color model (D60, D62, D65, D80): a palette
// file, in protobuf text format (`.txtpb`).  A provisioning server names
// one beside a wallpaper picture:
//
//   <setting id="wallpaper_file" url="..." [md5="..."]/>
//   <setting id="opendeskphone_palette_file" url="..." [md5="..."]/>
//
// The palette applies while that picture is the wallpaper.  Without a
// palette file the picture is shown with the firmware's default palette.
// The built-in wallpapers have palettes of the same roles.
//
// Every color is a string "#RRGGBB".  Every field is optional:
//
// - `primary` and `surface` are the two colors a whole palette is derived
//   from, by the rule the built-in wallpapers use: `surface` is the
//   background of menus, and softkeys, line-key tabs, dialogs, and borders
//   are shades of it; `primary` is the selection and an active call, and
//   the title bar is a darker shade of it.  `light: true` derives a light
//   palette (dark text on a light `surface`); otherwise the palette is
//   dark (light text on a dark `surface`).  With neither `primary` nor
//   `surface`, the starting point is the default palette.
// - A role given by name replaces the derived (or default) color of that
//   role alone.
//
// A field this firmware does not know is skipped with a log entry, so a
// file written for a later firmware still loads.  A color that is not
// "#RRGGBB" is skipped the same way.  A file that is not protobuf text
// format is not used at all: the default palette applies.  Pairings with
// little contrast (e.g., `fg` on `bg`) are reported in the log and used
// as given.
//
// Example, a complete file:
//
//   # Palette for lobby.png
//   primary: "#1F6E4E"
//   surface: "#0F1E18"
//   title_bg: "#14503A"
//   accent: "#8FD6B4"
message Palette {
  // Derive a light palette from `primary` and `surface`.  Default: false.
  optional bool light = 1;
  // The selection, and the color the title bar is a shade of.
  optional string primary = 2;
  // The background of menus, and the color softkeys, tabs, dialogs, and
  // borders are shades of.
  optional string surface = 3;

  // The roles, each replacing the derived color.

  // Background of menus, lists, and app screens.
  optional string bg = 10;
  // Text and icons on the background and on the call cards; and, unless
  // `wallpaper_fg` is given, on the wallpaper.
  optional string fg = 11;
  // Title bar, and the state band of the call screens.
  optional string title_bg = 12;
  // Text on the title bar.
  optional string title_fg = 13;
  // Selected row.
  optional string sel_bg = 14;
  // Text of the selected row.
  optional string sel_fg = 15;
  // Secondary text (values, hints, placeholders) and the scroll thumb.
  optional string secondary = 16;
  // Row separators, frames, and the scroll track.
  optional string border = 17;
  // Background of dialogs, notices, and the volume display.
  optional string modal_bg = 18;
  // Softkey fill.
  optional string sk_bg = 19;
  // Softkey outline, and the frame of dialogs and inputs.
  optional string sk_edge = 20;
  // Softkey label, on every softkey.
  optional string sk_fg = 21;
  // Fill of an "answer" softkey.  Keep it green.
  optional string sk_go = 22;
  // Fill of an "end", "ignore", or "reject" softkey.  Keep it red.
  optional string sk_stop = 23;
  // Something good or done.  Keep it green.
  optional string good = 24;
  // A warning.  Keep it amber.
  optional string warn = 25;
  // An error.  Keep it red.
  optional string error = 26;
  // Focus ring, cursor, and the information icon.
  optional string accent = 27;
  // Call card of an active call.
  optional string card = 28;
  // Call card of a ringing call.  Keep it green.
  optional string card_ringing = 29;
  // Call card of a held call.
  optional string card_held = 30;
  // The right part of a call card.
  optional string card_dark = 31;
  // Line-key tab fill.
  optional string tab_bg = 32;
  // Line-key tab label and icon.
  optional string tab_fg = 33;
  // Loading bar: the empty track.
  optional string load_track = 34;
  // Loading bar: the filled part.
  optional string load_fill = 35;
  // Text and icons on the wallpaper itself: the idle screen's clock,
  // date, and status icons.  Default: `fg`.  Give it when the wallpaper
  // and the menus' background are unlike, e.g., a bright picture over
  // dark menus.
  optional string wallpaper_fg = 36;
}
