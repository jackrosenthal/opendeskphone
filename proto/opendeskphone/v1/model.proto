syntax = "proto3";

package opendeskphone.v1;

// A model of phone.
enum Model {
  // Not known, or not given.
  MODEL_UNSPECIFIED = 0;
  MODEL_D40 = 1;
  MODEL_D45 = 2;
  MODEL_D50 = 3;
  MODEL_D60 = 4;
  MODEL_D62 = 5;
  MODEL_D65 = 6;
  MODEL_D70 = 7;
  MODEL_D80 = 8;
}

// The kind of screen a model has, which its user interface is drawn for.
enum Skin {
  SKIN_UNSPECIFIED = 0;
  // D40, D45, D50: 240x120, four gray levels.
  SKIN_SMALL_GRAY = 1;
  // D70: 320x160, four gray levels, and the 113x357 side display.
  SKIN_LARGE_GRAY = 2;
  // D60, D62, D65: 480x272 color.
  SKIN_COLOR = 3;
  // D80: 800x1280 color, upright, with a touchscreen.
  SKIN_TOUCH = 4;
}
