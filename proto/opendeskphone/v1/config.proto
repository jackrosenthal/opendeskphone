syntax = "proto3";

package opendeskphone.v1;

import "opendeskphone/settings/v1/settings.proto";

// Access to the merged configuration by stock setting ID, for the web
// interface's settings forms.
service ConfigService {
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse);
  // The softkeys of the phone's idle screen, in order.
  rpc GetIdleSoftkeys(GetIdleSoftkeysRequest) returns (GetIdleSoftkeysResponse);
  rpc SetIdleSoftkeys(SetIdleSoftkeysRequest) returns (SetIdleSoftkeysResponse);
  // The theme of a color model: its wallpaper and the colors of every
  // screen.
  rpc GetTheme(GetThemeRequest) returns (GetThemeResponse);
  rpc SetTheme(SetThemeRequest) returns (SetThemeResponse);
}

message Setting {
  string id = 1;
  // Secret values (passwords) are returned empty with `secret` set.
  string value = 2;
  // A configuration layer, the image's or the provisioning server's, froze
  // the setting, so a value set on the phone does not replace it.
  bool frozen = 3;
  reserved 4;
  bool secret = 5;
  // The value in effect is the provisioning server's, because it is frozen
  // or no value is set on the phone.
  bool provisioned = 6;
}

message ListSettingsRequest {
  // Only IDs with this prefix; empty for all.
  string prefix = 1;
}

message ListSettingsResponse {
  repeated Setting settings = 1;
  uint64 generation = 2;
}

message SettingChange {
  string id = 1;
  string value = 2;
}

message SetSettingsRequest {
  repeated SettingChange changes = 1;
}

message SetSettingsResponse {
  uint64 generation = 1;
}

// Where the value of one of Open Desk Phone's own settings came from.
enum SettingSource {
  SETTING_SOURCE_UNSPECIFIED = 0;
  SETTING_SOURCE_DEFAULT = 1;
  // Set on the phone.
  SETTING_SOURCE_LOCAL = 2;
  // Supplied by the provisioning server.
  SETTING_SOURCE_PROVISIONED = 3;
}

// A softkey the idle screen can have.
message IdleSoftkeyChoice {
  opendeskphone.settings.v1.IdleSoftkey softkey = 1;
  string label = 2;
}

message IdleSoftkeys {
  // The softkeys in effect, in order.
  repeated opendeskphone.settings.v1.IdleSoftkey softkeys = 1;
  SettingSource source = 2;
  // The provisioning server fixed the list; it cannot be changed here.
  bool locked = 3;
  // Every softkey this phone offers, those in effect included.
  repeated IdleSoftkeyChoice choices = 4;
}

message GetIdleSoftkeysRequest {}

message GetIdleSoftkeysResponse {
  IdleSoftkeys idle_softkeys = 1;
}

message SetIdleSoftkeysRequest {
  // Empty: drop the list set on the phone, which puts the provisioned or
  // default softkeys back.
  repeated opendeskphone.settings.v1.IdleSoftkey softkeys = 1;
}

message SetIdleSoftkeysResponse {
  IdleSoftkeys idle_softkeys = 1;
}

// The effective value of one of Open Desk Phone's own on/off settings.
message BoolSetting {
  bool value = 1;
  SettingSource source = 2;
  // The provisioning server fixed the value; it cannot be changed here.
  bool locked = 3;
}

// A built-in theme.
message ThemeChoice {
  // Its name in the configuration, e.g., "dusk".
  string id = 1;
  // The name shown.
  string name = 2;
  // The family it is listed under, e.g., "Gradients".
  string family = 3;
}

message Theme {
  // The built-in theme in effect (the `id` of one of `choices`).  Not
  // what is shown while `picture` is set.
  string id = 1;
  SettingSource source = 2;
  // The provisioning server fixed the theme; it cannot be changed here.
  bool locked = 3;
  // Every built-in theme, grouped by family.
  repeated ThemeChoice choices = 4;
  // The provisioning server's picture is the wallpaper, with its palette,
  // not a built-in theme.
  bool picture = 5;
}

message GetThemeRequest {}

message GetThemeResponse {
  Theme theme = 1;
}

message SetThemeRequest {
  // The `id` of a built-in theme.  Empty: drop the choice made on the
  // phone, which puts the provisioned or default theme back.
  string id = 1;
}

message SetThemeResponse {
  Theme theme = 1;
}
