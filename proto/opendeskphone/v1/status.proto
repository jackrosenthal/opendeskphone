syntax = "proto3";

package opendeskphone.v1;

import "opendeskphone/v1/accounts.proto";
import "opendeskphone/v1/calls.proto";
import "opendeskphone/v1/firmware.proto";
import "opendeskphone/v1/model.proto";
import "opendeskphone/v1/network.proto";
import "opendeskphone/v1/provisioning.proto";

service StatusService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Sends the whole status at once, then again whenever any part changes.
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);
}

enum SystemPhase {
  SYSTEM_PHASE_UNSPECIFIED = 0;
  SYSTEM_PHASE_STARTING = 1;
  SYSTEM_PHASE_NETWORK_WAIT = 2;
  SYSTEM_PHASE_PROVISIONING = 3;
  SYSTEM_PHASE_RUNNING = 4;
  SYSTEM_PHASE_RECOVERY = 5;
  SYSTEM_PHASE_SHUTTING_DOWN = 6;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_STOPPED = 1;
  HEALTH_STATE_STARTING = 2;
  HEALTH_STATE_OK = 3;
  HEALTH_STATE_DEGRADED = 4;
  HEALTH_STATE_FAILED = 5;
}

message SystemInfo {
  Model model = 1;
  // "3.1.1"
  string version = 2;
  SystemPhase phase = 3;
  string mac = 4;
  string hostname = 5;
  bool time_synced = 6;
  string timezone = 7;
  string last_reboot_reason = 8;
  bool simulated = 10;
  uint32 mem_total_kib = 11;
  uint64 uptime_secs = 12;
  uint64 unix_time = 13;
  Skin skin = 14;
  string user_agent = 15;
  // The model has a Bluetooth controller.
  bool has_bluetooth = 16;
  // The model takes expansion modules.
  bool has_expansion = 17;
}

// A subsystem of the phone's main program.
enum Subsystem {
  SUBSYSTEM_UNSPECIFIED = 0;
  SUBSYSTEM_CORE = 1;
  // The configuration.
  SUBSYSTEM_CONFIG = 2;
  // The network.
  SUBSYSTEM_NET = 3;
  SUBSYSTEM_SIP = 4;
  SUBSYSTEM_MEDIA = 5;
  // Provisioning.
  SUBSYSTEM_DPMA = 6;
  // The phone's user interface.
  SUBSYSTEM_UI = 7;
  SUBSYSTEM_APPS = 8;
  // The web interface.
  SUBSYSTEM_WEB = 9;
  SUBSYSTEM_SSH = 10;
  // Firmware updates.
  SUBSYSTEM_UPDATE = 11;
}

message SubsystemHealth {
  Subsystem subsystem = 1;
  HealthState state = 2;
  string detail = 3;
}

message StatusSnapshot {
  SystemInfo system = 1;
  NetworkStatus network = 2;
  ProvisioningStatus provisioning = 3;
  repeated AccountStatus accounts = 4;
  CallsSnapshot calls = 5;
  FirmwareStatus firmware = 6;
  repeated SubsystemHealth health = 7;
  bool healthy = 8;
  uint64 config_generation = 9;
  bool restart_needed = 10;
  string config_error = 11;
}

message GetStatusRequest {}

message GetStatusResponse {
  StatusSnapshot status = 1;
}

message WatchStatusRequest {}

message WatchStatusResponse {
  StatusSnapshot status = 1;
}
