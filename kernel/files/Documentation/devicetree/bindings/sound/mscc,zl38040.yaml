%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mscc,zl38040.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microsemi ZL38040 voice processor

description: |
  The ZL38040 is a voice processor with acoustic echo cancellation.  It is
  controlled over SPI and has two TDM/I2S ports, two DAC outputs, and
  microphone inputs.  The host boots its firmware.  This binding covers its
  use in the Digium D80 desk phone, where the host is on TDM-B and a
  Bluetooth module is on TDM-A.

maintainers:
  - Open Desk Phone contributors

allOf:
  - $ref: dai-common.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: mscc,zl38040

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 24000000

  spi-cpol: true

  spi-cpha: true

  reset-gpios:
    description: Reset line of the chip, active low.
    maxItems: 1

  handset-select-gpios:
    description:
      Switch that connects the chip's second DAC and third microphone input
      to the handset when active and to the headset when inactive.
    maxItems: 1

  speaker-amp-gpios:
    description: Enable line of the amplifier on the chip's first DAC.
    maxItems: 1

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@0 {
            compatible = "mscc,zl38040";
            reg = <0>;
            #sound-dai-cells = <0>;
            spi-max-frequency = <20000000>;
            spi-cpol;
            spi-cpha;
            reset-gpios = <&gpio1 0 GPIO_ACTIVE_LOW>;
            handset-select-gpios = <&gpio1 9 GPIO_ACTIVE_HIGH>;
            speaker-amp-gpios = <&gpio7 12 GPIO_ACTIVE_HIGH>;
        };
    };
