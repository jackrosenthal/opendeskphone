[workspace]
resolver = "3"
# Members are listed one by one, not by glob: a crate directory that is still
# being created (no manifest, or one that does not parse yet) must not break
# cargo for every other crate.  Add a crate here when it builds.
members = [
    "crates/opendeskphone-app-sdk",
    "crates/opendeskphone-app-sdk-macros",
    "crates/opendeskphone-svg",
    "crates/opendeskphone",
    "crates/opendeskphone-apps",
    "crates/opendeskphone-bt",
    "crates/opendeskphone-config",
    "crates/opendeskphone-ctrl",
    "crates/opendeskphone-early",
    "crates/opendeskphone-hal",
    "crates/opendeskphone-image",
    "crates/opendeskphone-media",
    "crates/opendeskphone-net",
    "crates/opendeskphone-recovery",
    "crates/opendeskphone-ui",
    "crates/opendeskphone-web",
    "crates/opendeskphone-sip",
    "crates/opendeskphone-dpma",
    "crates/opendeskphone-state",
    "crates/opendeskphone-ui",
    "crates/opendeskphone-web",
    "crates/opendeskphone-update",
    "crates/opendeskphone-vpm",
    "crates/opendeskphone-update",
    "crates/opendeskphone-web",
    "crates/eff",
    "crates/jffs2-image",
    "crates/test-inputs",
    "xtask",
    # The DPMA module for Asterisk, its libraries, its test suites, and its
    # own `cargo xtask` (open-dpma/README.md).  dpma-sys reads the headers of an
    # Asterisk source tree, so dpma-sys, dpma-ast, and res_open_dpma build
    # only with `ASTERISK_SOURCE_DIR` set; without it, leave them out of a
    # command over the whole workspace (`--exclude`).
    "open-dpma/crates/dpma-ast",
    "open-dpma/crates/dpma-bytes",
    "open-dpma/crates/dpma-proto",
    "open-dpma/crates/dpma-sys",
    "open-dpma/crates/res_open_dpma",
    "open-dpma/tests",
    "open-dpma/tools",
]
exclude = ["apps"]

[workspace.package]
version = "3.1.1"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Jack Rosenthal <jack@rosenth.al>"]
repository = "https://github.com/jackrosenthal/opendeskphone"

# What the crates under open-dpma/ depend on.
[workspace.dependencies]
dpma-ast = { path = "open-dpma/crates/dpma-ast" }
dpma-sys = { path = "open-dpma/crates/dpma-sys" }
# dpma-proto is published with this requirement.  It is exact, so that cargo
# refuses to build when it is not the version above.
dpma-bytes = { path = "open-dpma/crates/dpma-bytes", version = "=3.1.1" }
dpma-proto = { path = "open-dpma/crates/dpma-proto" }
bstr = { version = "1.13", default-features = false, features = ["std"] }
bindgen = "0.73"
serde_json = { version = "1.0", features = ["preserve_order"] }
libc = "0.2"
serde = "1.0"
base64 = "0.22"
log = "0.4"
hex = "0.4"
# Cryptography (RustCrypto).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
getrandom = "0.2"
md-5 = { version = "0.10", features = ["oid"] }
miniz_oxide = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rsa = { version = "0.9", features = ["sha1", "sha2", "pem", "hazmat"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", default-features = false }

[profile.dev]
debug = 0

# RSA key generation for the test PKI (dpma-tests) is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# The app interpreter, for the tests that run the apps: unoptimized, an
# app's event handler takes long enough that a busy machine runs it over
# its time limit.
[profile.dev.package.pulley-interpreter]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# Unwinding, not abort: a panic in one subsystem's thread or task must not
# take the SSH server down with it.
panic = "unwind"
strip = true

# The app interpreter's inner loop: measured markedly slower when built for
# size (see crates/opendeskphone-apps/README.md).
[profile.release.package.pulley-interpreter]
opt-level = 3

# The DPMA module for Asterisk (res_open_dpma) runs in a server: it is built
# for speed, without the link-time optimization of the phone's binary.
[profile.module]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = "debuginfo"
