[package]
name = "res_open_dpma"
description = "Open source, drop-in replacement for the Digium Phone Module for Asterisk (DPMA)"
version.workspace = true
license.workspace = true
edition = "2021"

[lib]
name = "res_open_dpma"
crate-type = ["cdylib", "rlib"]

[features]
# Test-only CLI commands (`dpmadev ...`) used by the test suites in
# tests/; never enabled in release builds.
devtest = []

[dependencies]
dpma-ast.workspace = true
dpma-proto.workspace = true
eff = { path = "../../../crates/eff" }
libc.workspace = true
log.workspace = true
mdns-sd = { version = "0.21.6", default-features = false }
# The migration of a stock-firmware D80 (crate::migrate): the Open Desk
# Phone package format and signing key (opendeskphone-recovery), and the
# key's public half for the updater script (rsa).
opendeskphone-recovery = { path = "../../../crates/opendeskphone-recovery" }
rsa.workspace = true
serde_json.workspace = true
