[package]
name = "opendeskphone-apps"
description = "Open Desk Phone: WebAssembly app runtime, host API, packages, and the app manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Compile WebAssembly to Pulley bytecode (Cranelift): what installs an app
# package.  The phone binary has it (a check in `crates/opendeskphone` fails
# the build of one that does not), as do the build host's
# `opendeskphone-apps-build`, which precompiles the built-in apps, and the host
# tests.
compile = ["wasmtime/cranelift", "wasmtime/pulley"]
# The host tool that componentizes, precompiles, and packs apps.
build-tool = ["compile", "dep:wit-component", "cli"]
# The command lines of this crate's programs.
cli = ["dep:clap"]
# Fake view and services for tests.  The fake PBX store keeps its keys as
# the DPMA module does, with the code they share (`dpma-proto`).
test-util = ["dep:dpma-proto"]
# `UiShell`: the adapter from the phone UI toolkit to this crate's `Shell`.
ui = ["dep:opendeskphone-ui"]

[dependencies]
clap = { version = "4", features = ["derive", "env"], optional = true }
opendeskphone-state = { path = "../opendeskphone-state" }
dpma-proto = { workspace = true, optional = true }
# Without its default features: whether the toolkit has the touch skin is
# for the program to say (`opendeskphone`'s feature `d80`).
opendeskphone-ui = { path = "../opendeskphone-ui", optional = true, default-features = false }
getrandom = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "process", "thread"] }
wasmtime = { version = "50", default-features = false, features = ["runtime", "component-model", "std"] }
# Makes a component of the module cargo builds for a built-in app; the
# phone binary does not have it.
wit-component = { version = "0.263", optional = true }

[[bin]]
name = "opendeskphone-apps-build"
required-features = ["build-tool"]

# Spike S1 measurement (see README): run on the phone or under qemu-arm.
[[bin]]
name = "opendeskphone-apps-s1"
required-features = ["test-util", "cli"]

[dev-dependencies]
test-inputs = { path = "../test-inputs" }
opendeskphone-apps = { path = ".", features = ["build-tool", "test-util", "ui"] }
# The writer of the manifest this crate reads (tests/sdk.rs).
opendeskphone-app-sdk = { path = "../opendeskphone-app-sdk" }
# The games' tests draw them with the phone UI on the simulator's display.
opendeskphone-hal = { path = "../opendeskphone-hal" }
opendeskphone-ui = { path = "../opendeskphone-ui" }
# The Light Up test makes the puzzles the app is expected to make, with the
# app's own game library (in the app's directory) built for this machine.
lightup-game = { path = "../../apps/lightup/game" }
# The Timer test reads the digits on screen by drawing them as the app
# does, with the app's library of large digits.
timer-face = { path = "../../apps/timer/face" }
png = "0.18"
