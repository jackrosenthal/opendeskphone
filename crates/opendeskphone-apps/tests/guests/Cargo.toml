# Guests used only by the host tests; never shipped.
[workspace]
resolver = "3"
members = ["checks", "faulty", "probe", "storeprobe"]

[workspace.package]
version = "3.1.1"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Jack Rosenthal <jack@rosenth.al>"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
