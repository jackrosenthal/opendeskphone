[package]
name = "opendeskphone-ui"
description = "Open Desk Phone: UI toolkit, skins, native screens, and the app view API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = ["touch"]
# The touch skin, which only the D80 has: its fonts, icons, and artwork
# (the largest of any skin), its on-screen keyboard, and what the screens
# do only when they are touched.  On by default, so that the simulator and
# the tests have every model.  The firmware of the phones with keys (D40 to
# D70), whose flash has no room to spare, is built without it
# (`opendeskphone`'s feature `d80`).
touch = []

[dependencies]
opendeskphone-state = { path = "../opendeskphone-state" }
opendeskphone-hal = { path = "../opendeskphone-hal" }
log = "0.4"
# Pixels as the bytes they are, for the copy to the frame buffer.
bytemuck = "1"
# App package icons and pictures (pure Rust; `flate2` and `miniz_oxide` are
# in the binary already for app packages).
png = "0.18"

[build-dependencies]
fontdue = "0.9"
resvg = { version = "0.48", default-features = false, features = ["text"] }

