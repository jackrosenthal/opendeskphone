[package]
name = "opendeskphone-image"
description = "Host tool: EFF, OTA, JFFS2, and kernel images for Open Desk Phone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
eff = { path = "../eff" }
jffs2-image = { path = "../jffs2-image" }
md-5 = "0.10"
miniz_oxide = "0.8"
sha1 = "0.10"

[dev-dependencies]
test-inputs = { path = "../test-inputs" }
