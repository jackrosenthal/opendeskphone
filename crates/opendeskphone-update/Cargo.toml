[package]
name = "opendeskphone-update"
description = "Open Desk Phone: on-device firmware updater (EFF/OTA to the spare bank, ctrl record, trial boot)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# Installing an image on a D80 (`d80`): the package is left for the phone's
# recovery.  The firmware binary of the D40 thru D70 is built without it.
d80 = ["dep:opendeskphone-recovery"]

[dependencies]
opendeskphone-recovery = { path = "../opendeskphone-recovery", optional = true }
eff = { path = "../eff" }
opendeskphone-ctrl = { path = "../opendeskphone-ctrl" }
opendeskphone-hal = { path = "../opendeskphone-hal" }
opendeskphone-state = { path = "../opendeskphone-state" }
libc = "0.2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
