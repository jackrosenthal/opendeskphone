[package]
name = "opendeskphone-media"
description = "RTP/SRTP, jitter buffer, tones, and the real-time audio engine around the voice DSP"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
opendeskphone-vpm = { path = "../opendeskphone-vpm" }
libc = "0.2"
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
# G.711 for every model, and G.722 for the D80, which has no DSP to run it.
# Without its default features: no G.729 and no Opus, and so none of their
# dependencies.
audio-codec = { version = "0.4.14", default-features = false }
getrandom = "0.2"
