// The manifest of an Open Desk Phone app.
//
// An app is one WebAssembly file.  What the phone has to know about it before
// running it (its name, what to call it on screen, its kind, its icon) is in
// the file itself: the custom section "opendeskphone-app" of the app's
// WebAssembly module holds one `Manifest` message in protobuf's binary form.
// The macro `export_app!` of the crate `opendeskphone-app-sdk` writes the
// section when the app is compiled; the firmware's crate `opendeskphone-apps`
// reads it, on the phone and when the firmware is built.  Both are written by
// hand against this file (the SDK's writer runs at compile time, in `const`
// code), and a test of `opendeskphone-apps` holds them to each other.
//
// The interfaces of the phone an app uses are not in the manifest: the
// phone takes them from the imports of the WebAssembly component.  Nor are
// an app's data files: an app holds its data in its code.

syntax = "proto3";

package opendeskphone.app.v1;

message Manifest {
  // The version of this format: 1.  A phone refuses a manifest whose
  // format it does not know.  New fields alone do not change it.
  uint32 format = 1;
  // The app's name on the phone: 1 to 64 characters, the first a letter or
  // digit, the rest letters, digits, '_', '.', or ','.
  string name = 2;
  // An identifier of the app, e.g., in reverse domain form.
  string id = 3;
  // What the phone calls the app on screen.
  Text display_name = 4;
  Text description = 5;
  Kind kind = 6;
  // The app has a window on the idle screen, and starts with the phone to
  // draw there.
  bool has_idle = 7;
  // The app is marked as hidden.
  bool hidden = 8;
  // One of the phone's icons, for an app that has no icon (or whose icon
  // the phone cannot show).
  Icon phone_icon = 13;
  // The most memory the app may have, in KiB; 0 is the phone's default.
  uint32 memory_kib = 10;
  // The app's icon: the content of a PNG file, at most 256 KiB.
  bytes icon = 11;
  // Icons for particular models of phone; a phone shows its model's, if
  // there is one, else `icon`.
  repeated ModelIcon icon_for = 12;

  // Not for an app's section, where the phone ignores it: in the record
  // the phone keeps of an app ("app.pb" in the app's directory), the
  // interfaces of the phone the app's component imports.
  repeated Capability capabilities = 16;

  // Fields of earlier forms: the phone icon's name, and the capabilities'
  // names.
  reserved 9, 15;
}

enum Kind {
  // As KIND_FOREGROUND.
  KIND_UNSPECIFIED = 0;
  // Runs while it is on screen.
  KIND_FOREGROUND = 1;
  // Starts with the phone and runs without being on screen.
  KIND_BACKGROUND = 2;
  // An app with a window on the idle screen says so with `has_idle`, and
  // is of one of the kinds above.  A phone refuses 3.
  reserved 3;
}

// A text the phone shows.  A message, so that texts in other languages
// can come with it once the phone is localized.
message Text {
  string text = 1;
  reserved 2;
}

message ModelIcon {
  PhoneModel model = 3;
  // The content of a PNG file, at most 256 KiB.
  bytes icon = 2;
  // The model's name in an earlier form.
  reserved 1;
}

enum PhoneModel {
  PHONE_MODEL_UNSPECIFIED = 0;
  PHONE_MODEL_D40 = 1;
  PHONE_MODEL_D45 = 2;
  PHONE_MODEL_D50 = 3;
  PHONE_MODEL_D60 = 4;
  PHONE_MODEL_D62 = 5;
  PHONE_MODEL_D65 = 6;
  PHONE_MODEL_D70 = 7;
  PHONE_MODEL_D80 = 8;
}

// The phone's icons, in the order of the enum `icon` of the app interface
// (`wit/app.wit`): the one-color icons, and the color icons of the apps
// (`APP_...`).
enum Icon {
