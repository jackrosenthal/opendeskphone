[workspace]
resolver = "3"
members = ["contacts", "voicemail", "status", "parking", "queues", "hotdesking", "calendar", "alarms", "diagnostics", "desksparrow", "boxpusher", "boxpusher/game", "lightup", "lightup/game"]

[workspace.package]
version = "3.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Jack Rosenthal <jack@rosenth.al>"]

[workspace.dependencies]
opendeskphone-app-sdk = { path = "../crates/opendeskphone-app-sdk" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The Light Up generator (apps/lightup/game) works for seconds on the
# phone: speed before size.
[profile.release.package.lightup-game]
opt-level = 3
