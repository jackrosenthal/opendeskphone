# Builds the firmware image of every model with Nix and runs the flake's
# checks.  The work is split into jobs that run at once, each building some
# of the flake's outputs (.github/actions/nix-build):
#
#   kernel, kernel-d80, web, apps, brush, coreutils, sed, userland-d80,
#   workspace, checks-deps, asterisk                      (nothing before them)
#   rootfs, d80, tests, clippy                            (from those)
#   one image per model, jffs2-mount                      (from rootfs)
#   checks                                                (`nix flake check`)
#   cache                                                 (for the next run)
#
# Each image is uploaded as a workflow artifact, `firmware-<model>`.  The
# D80's, which `d80` builds whole, is the artifact `d80-image`: its EFF,
# the Android OTA package inside it, and its recovery image.  Its EFF is
# among the images of a release.
#
# The DPMA module for Asterisk (open-dpma/) is built, linted, and tested for
# every pinned Asterisk major version on x86_64 and aarch64.  Each of those
# jobs is a thin wrapper around `cargo xtask ci` in open-dpma/, which runs the
# same way locally (with podman or docker):
#
#   cd open-dpma && cargo xtask ci --asterisk <major>
#
# Each module is uploaded as a workflow artifact,
# `res_open_dpma-asterisk<major>-<arch>`.
#
# A pushed tag vX.Y.Z (the workspace version in Cargo.toml) also publishes
# the seven images and the modules as a GitHub Release, and then publishes
# dpma-bytes, dpma-proto, and opendeskphone-app-sdk to crates.io (trusted
# publishing).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request replaces the run in progress; a
# tag's run (a release) is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The pieces that depend on nothing else in the repository.  The Rust
  # jobs link for the phone with rust-lld; only the kernel uses the ARM C
  # toolchain, which comes from the public binary cache.
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kernel
            installables: .#kernel
          # The D80's kernel, for its image (`d80`).
          - name: kernel-d80
            installables: .#kernel-d80
          - name: web
            installables: .#web
          - name: apps
            installables: .#apps
          - name: brush
            installables: .#brush
          - name: coreutils
            installables: .#coreutils
          - name: sed
            installables: .#sed
          # The shell and the utilities for the D80's processor.
          - name: userland-d80
            installables: .#brush-d80 .#coreutils-d80 .#sed-d80
          # The image tool, and the dependencies of the firmware binary;
          # the binary itself embeds the web frontend, so it is built in
          # `rootfs`.
          - name: workspace
            installables: .#opendeskphone-image .#opendeskphone.cargoArtifacts
          # The dependencies of the tests and of clippy.
          - name: checks-deps
            installables: .#checks.x86_64-linux.tests.cargoArtifacts
          # Asterisk with res_open_dpma (open-dpma/), which the tests register
          # against.
          - name: asterisk
            installables: .#asterisk-modules
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: ${{ matrix.name }}
          installables: ${{ matrix.installables }}
          cache: true

  # The firmware binary and the root file system, which all models share.
  # This job downloads the vendor's two stock images for the DSP firmware;
  # the cache keeps what it takes from them.
  rootfs:
    name: rootfs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: rootfs
          installables: .#rootfs .#rootfs-tree .#opendeskphone .#opendeskphone-image .#kernel
          cache: true
          stores: nix-new-{kernel,web,apps,brush,coreutils,sed,workspace}
          results: true

  # The D80's image: its firmware binary (built for its own processor,
  # with the touch skin, which the build checks it has, as the build of the
  # other binary in `rootfs` checks that the D40 thru D70 do not get it),
  # its root file system, its boot image, and its recovery image, as an
  # Android OTA package and as the EFF that carries the package.  This job downloads the
  # vendor's stock D80 image for the firmware files of the voice processor
  # and the wireless module; the cache keeps what it takes from it.
  d80:
    name: d80
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: d80
          installables: .#eff-d80 .#ota-d80 .#recovery-d80
          cache: true
          stores: nix-new-{kernel-d80,web,apps,userland-d80,workspace}

      # Each out-link is a file, under its own name in the store.
      - name: Copy the image out of the store
        run: |
          mkdir dist
          for link in "$RUNNER_TEMP"/nix/links/result*; do
            image="$(readlink "$link")"
            cp "$image" "dist/${image#/nix/store/*-}"
          done
          ls -l dist

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: d80-image
          path: dist
          if-no-files-found: error

  model:
    name: ${{ matrix.model }}
    needs: rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [d40, d45, d50, d60, d62, d65, d70]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          installables: .#eff-${{ matrix.model }}
          stores: nix-results-rootfs

      # The out-link is the image itself, under its own name in the store.
      - name: Copy the image out of the store
        run: |
          image="$(readlink "$RUNNER_TEMP/nix/links/result")"
          mkdir dist
          cp "$image" "dist/${image#/nix/store/*-}"
          ls -l dist

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.model }}
          path: dist
          if-no-files-found: error

  # The tests download the vendor's stock images too; the cache keeps them.
  tests:
    name: tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: tests
          installables: .#checks.x86_64-linux.tests
          cache: true
          stores: nix-new-{workspace,apps,checks-deps,asterisk}

  clippy:
    name: clippy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: clippy
          installables: .#checks.x86_64-linux.clippy
          cache: true
          stores: nix-new-checks-deps

  # Runs in a virtual machine, with the runner's /dev/kvm.
  jffs2-mount:
    name: jffs2-mount
    needs: rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          name: jffs2-mount
          installables: .#checks.x86_64-linux.jffs2-mount
          stores: nix-results-rootfs

  # Every check the flake defines.  The jobs above have built them all, so
  # this builds nothing unless a check has been added without a job.
  checks:
    name: checks
    needs: [rootfs, d80, tests, clippy, jffs2-mount]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-build
        with:
          cache: true
          stores: nix-new-{kernel,kernel-d80,brush,coreutils,sed,rootfs,d80,tests,clippy,jffs2-mount}

      - run: nix flake check --print-build-logs

  # What the jobs of this run added, joined to the cache that they started
  # from, for the next run.  It runs after failures too, so that what did
  # build is not built again.  The cache holds what the build of the images
  # and the checks needs and the public binary cache does not have; that
  # includes the vendor's stock images, so only a run that starts with no
  # cache needs the vendor's server.
  cache:
    name: cache
    needs: [build, rootfs, d80, tests, clippy, jffs2-mount]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - id: nix
        uses: ./.github/actions/nix-build
        with:
          cache: true
          stores: nix-new-*

      - name: Join and prune
        id: joined
        run: |
          cp --recursive "$RUNNER_TEMP/nix/in/." "$RUNNER_TEMP/nix/cache/"
          # shellcheck disable=SC2016 # the ${n} is Nix's
          checks="$(nix eval --raw .#checks.x86_64-linux --apply 'c: builtins.concatStringsSep " " (map (n: ".#checks.x86_64-linux.${n}") (builtins.attrNames c))')"
          # shellcheck disable=SC2086 # one argument per check
          echo "key=nix-store-$(.github/actions/nix-build/store.sh prune "$RUNNER_TEMP/nix/cache" .#all $checks)" >> "$GITHUB_OUTPUT"
          du --summarize --human-readable "$RUNNER_TEMP/nix/cache"

      - if: steps.joined.outputs.key != steps.nix.outputs.cache-key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix/cache
          key: ${{ steps.joined.outputs.key }}

  # The firmware's crates are not all formatted with rustfmt; the crates of
  # open-dpma/ are.
  open-dpma-fmt:
    name: Open DPMA formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Rust 1.99
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt && rustup default 1.99

      - run: cargo fmt --check -p dpma-ast -p dpma-bytes -p dpma-proto -p dpma-sys -p res_open_dpma -p dpma-tests -p dpma-xtask

  open-dpma-versions:
    name: Pinned Asterisk versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      majors: ${{ steps.pins.outputs.majors }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust 1.99
        run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99

      - id: pins
        working-directory: open-dpma
        run: echo "majors=$(cargo xtask majors)" >> "$GITHUB_OUTPUT"

  open-dpma-test:
    name: Asterisk ${{ matrix.asterisk }} (${{ matrix.arch }})
    needs: open-dpma-versions
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        asterisk: ${{ fromJSON(needs.open-dpma-versions.outputs.majors) }}
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      # The runners have both; the image cache below is docker's.
      DPMA_ENGINE: docker
    steps:
      - uses: actions/checkout@v7

      # Rust runs only the xtask on the runner; the build and the tests run
      # in the test container.  (rustup is installed first where the
      # runner image has none.)
      - name: Rust 1.99
        run: |
          command -v rustup || { curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" && export PATH="$HOME/.cargo/bin:$PATH"; }
          rustup toolchain install 1.99 --profile minimal && rustup default 1.99

      # Keyed by what the image's tag covers (image_tag in
      # open-dpma/tools/src/container.rs), so that the xtask finds the image and
      # does not build it again.
      - name: Restore the test image
        id: image
        uses: actions/cache/restore@v6
        with:
          path: test-image.tar
          key: test-image-${{ matrix.asterisk }}-${{ matrix.arch }}-${{ hashFiles('open-dpma/tools/Containerfile', 'open-dpma/tools/asterisk-conf/**', 'open-dpma/tools/asterisk-versions', 'open-dpma/tools/src/container.rs') }}

      - name: Load the test image
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load -i test-image.tar && rm test-image.tar

      - name: Build, lint, and test Open DPMA
        working-directory: open-dpma
        run: cargo xtask ci --asterisk ${{ matrix.asterisk }}

      # Saved even when the tests fail, so that the next run does not
      # build the image again.
      - name: Save the test image
        if: always() && steps.image.outputs.cache-hit != 'true'
        run: docker save -o test-image.tar open-dpma-asterisk

      - uses: actions/cache/save@v6
        if: always() && steps.image.outputs.cache-hit != 'true' && hashFiles('test-image.tar') != ''
        with:
          path: test-image.tar
          key: ${{ steps.image.outputs.cache-primary-key }}

      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-asterisk${{ matrix.asterisk }}-${{ matrix.arch }}
          path: target/container/*/logs
          if-no-files-found: ignore

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: res_open_dpma-asterisk${{ matrix.asterisk }}-${{ matrix.arch }}
          path: target/container/*/res_open_dpma-asterisk${{ matrix.asterisk }}-${{ matrix.arch }}.so
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [model, d80, checks, open-dpma-fmt, open-dpma-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # For the LICENSE, which goes into the release.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: d80-image
          path: d80-image

      - name: The D80's image
        run: mv d80-image/*_D80_firmware.eff dist/

      # The images are named <X_Y_Z>_<MODEL>_firmware.eff after the version
      # they were built with: exactly the eight of the tag's version.
      - name: The tag names the version of every image
        working-directory: dist
        run: |
          version="$(echo "${GITHUB_REF_NAME#v}" | tr . _)"
          expected="$(printf '%s\n' "$version"_D{40,45,50,60,62,65,70,80}_firmware.eff)"
          test "$(printf '%s\n' * | LC_ALL=C sort)" = "$expected"

      # The modules were built from the same commit, so they have the same
      # version.  upload-artifact keeps the directory that the upload path's
      # wildcard matched (the Asterisk release), so the modules are moved
      # out of it.
      - uses: actions/download-artifact@v8
        with:
          pattern: res_open_dpma-*
          path: modules
          merge-multiple: true

      - name: The modules
        run: find modules -name 'res_open_dpma-*.so' -exec mv -t dist {} +

      # Running the job again replaces the files of the release it made.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.eff dist/*.so LICENSE --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.eff dist/*.so LICENSE --verify-tag --generate-notes
          fi

  # Last, because a version on crates.io cannot be replaced: everything
  # before it can be run again.  A crate whose version crates.io already
  # has is skipped, so this job can be run again too.
  publish:
    name: Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # The crates are in dependency order: dpma-proto uses dpma-bytes, the
      # SDK uses its macros, and the macros use the renderer.
      CRATES: dpma-bytes dpma-proto opendeskphone-svg opendeskphone-app-sdk-macros opendeskphone-app-sdk
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The crates have the firmware's version.
      - name: The tag names each crate's version
        run: |
          for crate in $CRATES; do
            version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
            echo "$crate $version"
            test "$GITHUB_REF_NAME" = "v$version"
          done

      # Exchanges the job's OIDC token for a short-lived crates.io token;
      # each crate's trusted publisher is configured on crates.io.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in $CRATES; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user-agent 'opendeskphone-ci' "https://crates.io/api/v1/crates/$crate/${GITHUB_REF_NAME#v}")"
            case "$status" in
              200) echo "$crate ${GITHUB_REF_NAME#v} is on crates.io already" ;;
              404) cargo publish --locked -p "$crate" ;;
              *) echo "crates.io answered $status for $crate" >&2; exit 1 ;;
            esac
          done
